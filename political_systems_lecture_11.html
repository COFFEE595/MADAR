    <style>

        .option-row:hover:not(.disabled-opt) { background: var(--option-hover-bg); border-color: var(--option-hover-border); }
        .option-row.disabled-opt { cursor: default; opacity: 0.9; }

        .option-row.wrong-highlight { background: var(--wrong-bg); border-color: var(--wrong-border); }
        .option-row input[type="radio"] { margin-left: 16px; accent-color: #7e6953; width: 20px; height: 20px; }
        .option-row label { font-size: 1.05rem; width: 100%; cursor: pointer; color: var(--text); }
        .result-indicator { display: none; margin-right: auto; font-size: 1.4rem; font-weight: bold; }
        .option-row.correct-highlight .result-indicator { display: block; color: #2e7d32; }

        .nav-btn:active { transform: translateY(3px); box-shadow: none; }
        .nav-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .finish-btn { background: var(--finish-btn-bg); color: var(--finish-btn-text); }
        #resultSection { display: none; }
        .result-screen { text-align: center; padding: 10px 0; }
        .final-score { font-size: 2.6rem; font-weight: 800; background: var(--result-bg); display: inline-block; padding: 16px 44px; border-radius: 80px; margin: 20px 0; color: var(--result-text); border: 2px solid var(--result-border); }
        .time-final { font-size: 1.3rem; margin-bottom: 15px; color: var(--text-secondary); }
        .btn-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 18px; }

        .flex-center { display: flex; justify-content: center; }
        .footer-note { text-align: center; color: var(--footer-color); margin-top: 20px; font-size: 0.85rem; }
        .footer-note a { color: var(--badge-text); text-decoration: none; background: var(--badge-bg); padding: 4px 12px; border-radius: 20px; }
        @media (max-width: 550px) { .content-inner { padding: 18px 14px; } .q-text { font-size: 1.1rem; } .nav-btn { padding: 10px 16px; min-width: 80px; } }

<body>
<div class="platform-wrapper">
    <div class="brand-bar"><span class="brand-name">Madar</span></div>
    <div class="content-inner">
        <div class="top-actions"><button class="toggle-theme-btn" id="toggleThemeBtn">🌓</button></div>

        <div id="quizSection">
            <div class="progress-area">
                <span class="q-counter" id="questionCounter">السؤال 1 / 28</span>
                <span class="timer-display" id="timerDisplay">⏱️ 00:00</span>

            </div>
            <div class="question-card">
                <div class="q-header"><span class="q-num" id="qNumDisplay">1</span><span class="q-text" id="qTextDisplay">تحميل...</span></div>

                <button class="nav-btn" id="nextBtn">التالي →</button>

            <div class="flex-center" style="margin-top:12px;"><button class="nav-btn finish-btn" id="finishBtn" style="display:none;">📋 إنهاء وعرض النتيجة</button></div>
        </div>

        <div id="resultSection">
            <div class="result-screen">
                <h2 style="color:var(--header-color);">📊 نتيجتك</h2>
                <div class="final-score" id="finalScoreDisplay">0 / 28</div>
                <div id="percentageDisplay" style="font-size:1.5rem;margin-bottom:4px;"></div>
                <div class="time-final" id="finalTimeDisplay"></div>
                <div class="btn-group"><button class="restart-btn" id="restartQuizBtn">🔄 إعادة الاختبار</button></div>
                <div class="footer-note">شكر خاص لـ <strong>ثري أكاديمي</strong> · تواصل عبر تيليجرام: <a href="https://t.me/GIX37" target="_blank">@GIX37</a></div>
            </div>
        </div>
        <div class="footer-note" id="quizFooter">شكر خاص لـ <strong>ثري أكاديمي</strong> · تواصل عبر تيليجرام: <a href="https://t.me/GIX37" target="_blank">@GIX37</a></div>
    </div>
</div>

<script>
(function(){
"use strict";

// ============ أسئلة المحاضرة الأخيرة (131-159) حسب التصحيح المعتمد ============
const rawQuestions = [
    { text: '........ عندما يستطيع أن يمارسه كل فرد من أفراد الشعب ممن توافرت فيهم بعض الشروط مما لا يتعارض مع العمومية', options: ['الاقتراع العام', 'الاقتراع المقيد'], correct: 0 }, // 131-أ
    { text: 'يكفي في الاقتراع العام أن يكون الشخص مواطناً ورشيداً', options: ['صح', 'غلط'], correct: 0 }, // 132-صح
    { text: 'من شروط الاقتراع المقيد أن يكون مثلاً على قدر من التعليم أو الثروة', options: ['صح', 'غلط'], correct: 0 }, // 133-صح
    { text: 'وفقاً لنظرية سيادة الأمة فالاقتراع مقيد', options: ['صح', 'غلط'], correct: 0 }, // 134-صح
    { text: 'وفقاً لنظرية سيادة الشعب فالاقتراع عام', options: ['صح', 'غلط'], correct: 0 }, // 135-صح
    { text: 'القيد في قاعدة بيانات المقترعين يكون ........', options: ['تلقائياً', 'بطلب من الشخص', 'بحسب نظام كل دولة'], correct: 2 }, // 136-ج
    { text: 'من ضمانات سلامة الاقتراع ........', options: ['استقلال الهيئات القائمة به', 'التنقيح الدوري للكشوف', 'جعل التصويت سراً', 'كل ما سبق صحيح'], correct: 3 }, // 137-د
    { text: 'استطلاعات الرأي ........', options: ['بالضرورة لها دور إيجابي', 'بالضرورة لها دور مضلل', 'قد يكون لها دور إيجابي أو مضلل'], correct: 2 }, // 138-ج
    { text: 'تجيز بعض الدول التصويت بالوكالة بضوابط معينة', options: ['صح', 'غلط'], correct: 0 }, // 139-صح
    { text: 'يكون الانتخاب ........ في حال قيام الناخب باختيار نوابه دون وسيط', options: ['مباشر', 'غير مباشر'], correct: 0 }, // 140-أ
    { text: 'يكون الانتخاب ........ في حال اختيار مندوبين يتولون اختيار النواب', options: ['مباشر', 'غير مباشر'], correct: 1 }, // 141-ب
    { text: 'يعاب على الانتخاب غير المباشر أنه ........', options: ['يمثل قيداً على حرية الناخب', 'يكون من السهل التأثير على المندوبين', 'كلاهما'], correct: 2 }, // 142-ج
    { text: 'تأخذ أغلب الدول بنظام الانتخاب ........', options: ['المباشر', 'غير المباشر'], correct: 0 }, // 143-أ
    { text: 'نظام الانتخاب بالقائمة تتسم فيه الدوائر ........... نطاقها', options: ['بصغر', 'باتساع'], correct: 1 }, // 144-ب
    { text: 'يتميز نظام الانتخاب الفردي بـ ........', options: ['سهولة تعرف الناخب على المرشحين', 'يضمن تمثيل الأقليات', 'كل ما سبق', 'لا شيء مما سبق'], correct: 2 }, // 145-ج
    { text: 'يساهم الانتخاب الفردي في تقوية دور الأحزاب السياسية', options: ['صح', 'غلط'], correct: 1 }, // 146-غلط
    { text: 'يساهم الانتخاب الفردي في إضعاف دور الأحزاب السياسية', options: ['صح', 'غلط'], correct: 0 }, // 147-صح
    { text: 'يساعد نظام القائمة المفتوحة على الأخذ بنظام الكوتة', options: ['صح', 'غلط'], correct: 1 }, // 148-غلط
    { text: 'يساعد نظام القائمة المغلقة على الأخذ بنظام الكوتة', options: ['صح', 'غلط'], correct: 0 }, // 149-صح
    { text: 'تأخذ الكثير من الدول بنظام ........', options: ['الحزب الواحد', 'تعدد الأحزاب'], correct: 1 }, // 151-ب
    { text: 'يعني نظام الحزبين أن يوجد حزبان سياسيان فقط', options: ['صح', 'غلط'], correct: 1 }, // 152-غلط
    { text: 'ينص الدستور المصري أن للمواطنين الحق في تكوين الأحزاب السياسية بـ ........ ينظمه القانون', options: ['تصريح', 'بإخطار'], correct: 1 }, // 153-ب
    { text: 'تنتهي الأحزاب السياسية اختيارياً بإرادة مؤسسيها أو بالاندماج وإجبارياً عن طريق حله', options: ['صح', 'غلط'], correct: 0 }, // 154-صح
    { text: 'نظام الحزب الواحد يوجد عادة في الدول الشمولية', options: ['صح', 'غلط'], correct: 0 }, // 155-صح
    { text: 'تنشأ الأحزاب السياسية وفقاً لأساس أيديولوجي فقط', options: ['صح', 'غلط'], correct: 1 }, // 156-غلط
    { text: 'يمكن إنشاء الأحزاب السياسية على أساس ديني أو طائفي', options: ['صح', 'غلط'], correct: 1 }, // 157-غلط
    { text: 'وفقاً للدستور المصري يقوم النظام السياسي على أساس ........', options: ['نظام الحزب الواحد', 'نظام الحزبين', 'نظام التعددية الحزبية'], correct: 2 }, // 158-ج
    { text: 'تتكون موارد الحزب من ........', options: ['اشتراكات أعضائه', 'تبرعات الأشخاص الطبيعيين المصريين', 'حصيلة استثمار أمواله في الأوجه غير التجارية', 'كل ما سبق'], correct: 3 } // 159-د
];

let questions = [...rawQuestions];
const TOTAL = questions.length;
let currentIndex = 0;
let userAnswers = new Array(TOTAL).fill(null);
let timerSeconds = 0;
let timerInterval = null;
let quizFinished = false;

// DOM elements
const quizSection = document.getElementById('quizSection');
const resultSection = document.getElementById('resultSection');
const timerDisplay = document.getElementById('timerDisplay');
const qCounter = document.getElementById('questionCounter');
const qNumDisplay = document.getElementById('qNumDisplay');
const qTextDisplay = document.getElementById('qTextDisplay');
const mcOptionsDiv = document.getElementById('mcOptions');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const finishBtn = document.getElementById('finishBtn');
const miniScore = document.getElementById('miniScore');
const quizFooter = document.getElementById('quizFooter');

const STORAGE_KEY = 'pol_sys_lec11_v1_corrected';
const THEME_KEY = 'pol_quiz_theme';

// helper functions
function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ currentIndex, userAnswers, timerSeconds }));
}
function loadState() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        try { const s = JSON.parse(saved); currentIndex = s.currentIndex; userAnswers = s.userAnswers; timerSeconds = s.timerSeconds; return true; }
        catch(e) { return false; }
    }
    return false;
}
function clearState() { localStorage.removeItem(STORAGE_KEY); }

function formatTime(secs) { const m = Math.floor(secs/60).toString().padStart(2,'0'); const s = (secs%60).toString().padStart(2,'0'); return `${m}:${s}`; }
function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => { if (!quizFinished) { timerSeconds++; timerDisplay.textContent = `⏱️ ${formatTime(timerSeconds)}`; saveState(); } }, 1000);
}
function stopTimer() { quizFinished = true; if (timerInterval) clearInterval(timerInterval); }

function applyVisualFeedback(index) {
    const q = questions[index], userAns = userAnswers[index];
    if (userAns === null) return;
    const rows = document.querySelectorAll('.option-row');
    rows.forEach((row, optIdx) => {
        const oldIndicator = row.querySelector('.result-indicator');
        if (oldIndicator) oldIndicator.remove();
        row.classList.remove('correct-highlight','wrong-highlight','disabled-opt');
        if (optIdx === q.correct) {
            row.classList.add('correct-highlight');
            const ind = document.createElement('span');
            ind.className = 'result-indicator';
            ind.textContent = '✓';
            row.appendChild(ind);
        }
        if (optIdx === userAns && userAns !== q.correct) {
            row.classList.add('wrong-highlight');
            const ind = document.createElement('span');
            ind.className = 'result-indicator';
            ind.textContent = '✗';
            row.appendChild(ind);
        }
        row.classList.add('disabled-opt');
    });
    document.querySelectorAll(`input[name="q${index}"]`).forEach(r => r.disabled = true);
}

function renderQuestion(index) {
    const q = questions[index];
    qNumDisplay.textContent = index + 1;
    qTextDisplay.textContent = q.text;
    qCounter.textContent = `السؤال ${index+1} / ${TOTAL}`;
    let html = '';
    q.options.forEach((opt, optIdx) => {
        const chk = userAnswers[index]===optIdx ? 'checked' : '';
        const dis = userAnswers[index]!==null ? 'disabled' : '';
        html += `<div class="option-row" onclick="${userAnswers[index]===null ? `window.selectRadio(${index},${optIdx})` : ''}"><input type="radio" name="q${index}" value="${optIdx}" ${chk} ${dis}><label>${String.fromCharCode(65+optIdx)}) ${opt}</label></div>`;
    });
    mcOptionsDiv.innerHTML = html;
    if (userAnswers[index] !== null) applyVisualFeedback(index);
    updateNavButtons();
    updateMiniScore();
}

window.selectRadio = function(qIdx, optIdx) {
    if (userAnswers[qIdx] !== null) return;
    userAnswers[qIdx] = optIdx;
    renderQuestion(qIdx);
    saveState();
};

function updateNavButtons() {
    prevBtn.disabled = (currentIndex === 0);
    const isLast = (currentIndex === TOTAL - 1);
    nextBtn.style.display = isLast ? 'none' : 'inline-block';
    finishBtn.style.display = isLast ? 'inline-block' : 'none';
}

function updateMiniScore() {
    const answered = userAnswers.filter(a => a!==null).length;
    const correct = userAnswers.reduce((acc, ans, i) => {
        if (ans===null) return acc;
        return acc + (ans === questions[i].correct ? 1 : 0);
    }, 0);
    miniScore.textContent = `📊 ${correct} / ${answered} صحيحة`;
}

function goPrev() { if (currentIndex > 0) { currentIndex--; renderQuestion(currentIndex); saveState(); } }
function goNext() { if (currentIndex < TOTAL - 1) { currentIndex++; renderQuestion(currentIndex); saveState(); } }

function finishQuiz() {
    stopTimer();
    const correctCount = userAnswers.reduce((acc, ans, i) => {
        if (ans===null) return acc;
        return acc + (ans === questions[i].correct ? 1 : 0);
    }, 0);
    const percent = Math.round((correctCount / TOTAL) * 100);
    quizSection.style.display = 'none';
    resultSection.style.display = 'block';
    quizFooter.style.display = 'none';
    document.getElementById('finalScoreDisplay').textContent = `${correctCount} / ${TOTAL}`;
    document.getElementById('percentageDisplay').textContent = `${percent}%`;
    document.getElementById('finalTimeDisplay').textContent = `⏱️ الوقت المستغرق: ${formatTime(timerSeconds)}`;
    clearState();
}

function restartQuiz() {
    stopTimer(); clearState();
    userAnswers = new Array(TOTAL).fill(null); currentIndex = 0; timerSeconds = 0;
    timerDisplay.textContent = '⏱️ 00:00'; quizFinished = false;
    resultSection.style.display = 'none'; quizSection.style.display = 'block'; quizFooter.style.display = 'block';
    renderQuestion(0); startTimer();
}

// Theme
function applyTheme(theme) {
    if (theme === 'dark') {
        document.body.classList.add('dark');
        document.getElementById('toggleThemeBtn').textContent = '☀️';
    } else {
        document.body.classList.remove('dark');
        document.getElementById('toggleThemeBtn').textContent = '🌙';
    }
    localStorage.setItem(THEME_KEY, theme);
}

document.getElementById('toggleThemeBtn').addEventListener('click', () => {
    const isDark = document.body.classList.contains('dark');
    applyTheme(isDark ? 'light' : 'dark');
});

prevBtn.addEventListener('click', goPrev);
nextBtn.addEventListener('click', goNext);
finishBtn.addEventListener('click', finishQuiz);
document.getElementById('restartQuizBtn').addEventListener('click', restartQuiz);

const savedTheme = localStorage.getItem(THEME_KEY) || 'light';
applyTheme(savedTheme);

const hasState = loadState();
if (!hasState) { currentIndex = 0; userAnswers = new Array(TOTAL).fill(null); timerSeconds = 0; }
timerDisplay.textContent = `⏱️ ${formatTime(timerSeconds)}`;
renderQuestion(currentIndex);
startTimer();

})();
</script>
</body>
</html>
