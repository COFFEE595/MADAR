  <script>
    document.addEventListener('contextmenu', event => event.preventDefault());
    ['copy', 'cut', 'paste'].forEach(eventName => {
        document.addEventListener(eventName, event => event.preventDefault());
    });
    document.addEventListener('dragstart', event => event.preventDefault());
    document.addEventListener('drop', event => event.preventDefault());
    document.addEventListener('keydown', function(event) {
        if (event.keyCode === 123) { event.preventDefault(); return false; }
        if (event.ctrlKey) {
            const key = event.key ? event.key.toLowerCase() : String.fromCharCode(event.keyCode).toLowerCase();
            if (['u', 's', 'c', 'a', 'p'].includes(key) || (event.shiftKey && ['i', 'c', 'j'].includes(key))) {
                event.preventDefault(); return false;
            }
        }
    });

      61: "للمصور الحق في نشر الصور في حالات محددة فقط: كالوقائع العلنية، أو إذن السلطات العامة، أو إذن الشخص نفسه.",
      62: "التنازل عن الحقوق الأدبية باطل بطلاناً مطلقاً لتعارضه مع النظام العام؛ إذ هي حقوق غير قابلة للتصرف.",
      63: "الحق الأدبي لا يسقط بالتقادم ولا بعدم الاستعمال، كلا السببين لا يُفضي إلى سقوطه مهما طال الزمن.",
      64: "الحقوق الأدبية تنتقل بعد الوفاة إلى الخلف العام (الورثة)، لا إلى الخلف الخاص ولا إلى الناشر.",
      65: "النشر يعني الإتاحة للجمهور؛ مجرد إعطاء المصنف للأصدقاء أو الناشر أو المنتج لا يُعدّ نشراً قانونياً.",
      66: "التعديل بالترجمة لا يُعدّ اعتداءً إلا في حالتين: إغفال الإشارة لمواطن الحذف، أو الإساءة لسمعة المؤلف.",
      67: "للمؤلف الحق في منع الناشر من أي تعديل في مصنفه؛ فهو حق أدبي مكفول بموجب قانون الملكية الفكرية.",
      68: "حق سحب المصنف من التداول حق شخصي للمؤلف وحده، ولا يتقرر للناشر ولا للورثة.",
      69: "في المصنف المشترك، لا يجوز لأي شريك منفرداً سحب المصنف من التداول؛ يلزم اتفاق جميع الشركاء.",
      70: "الحق المالي هو حق المؤلف في احتكار استغلال إنتاجه الفكري مادياً، بخلاف الحق الأدبي المرتبط بالشخصية.",
      71: "ينقضي الحق المالي للمؤلف بمرور 50 سنة من تاريخ وفاته، وينتقل بعد ذلك المصنف إلى الملك العام.",
      72: "الكتابة شرط لانعقاد التنازل عن الحق المالي، فإن لم تتوفر الكتابة كان التصرف باطلاً لا مجرد عسير الإثبات.",
      73: "في مصنفات الموسيقى الغنائية: مؤلف الشطر الموسيقي هو الشطر الأساسي، ومن ثم له قرار نشر المصنف.",
      74: "الحق المالي للمؤلف يجوز التصرف فيه والتنازل عنه وينتقل للورثة، على خلاف الحق الأدبي تماماً.",
      75: "من سلطات الحق الأدبي: نسبة المصنف للمؤلف، وإتاحته للجمهور، ومنع تعديله، وسحبه من التداول.",
      76: "لا تمتد الحماية لعنوان المصنف إلا إذا كان مبتكراً وألا يكون مجرد لفظ يُوضّح الموضوع.",
      77: "إذا توفي المؤلف دون وارث أو موصى له، تُباشر الوزارة المختصة الحقوق الأدبية للمؤلف.",
      78: "الحق الأدبي للمؤلف خارج دائرة التعامل وغير قابل للتصرف؛ فهو من الحقوق اللصيقة بالشخصية.",
      79: "المؤلف قد يكون شخصاً طبيعياً أو اعتبارياً، وكلاهما يتمتع بذات الحقوق وفق قانون حماية الملكية الفكرية.",
      80: "المفوض عن المؤلف يُعدّ وكيلاً عنه يلتزم بتقديم الحسابات وأداء المبالغ ونقل الحقوق.",
      81: "الابتكار النسبي هو الذي يقتبس عناصر شكلية من إنتاج سابق مع إضافة طابع شخصي جديد يُميّزه.",
      82: "الشركاء في المصنف السمعي البصري: مؤلف السيناريو، ومؤلف الحوار، والمخرج (بشرط الدور الإبداعي).",
      83: "مؤلف المصنف الأصلي المُحوَّر شريك في المصنف السمعي البصري، بعكس الممثل والمترجم والمصوّر.",
      84: "استبعد المشرع من نطاق الشركاء في المصنف السمعي البصري كلاً من: المصور، والمترجم، والممثل، ومركّب المصنف — لأن أدوارهم تقنية أو تنفيذية لا إبداعية فكرية. والإجابة (د) جميع ما سبق هي الأصح قانونياً وفق القانون 82 لسنة 2002.",
      85: "الحق في منع تعديل المصنف تعديلاً مُشوِّهاً مكفول للمؤلف وخلفه العام (الورثة) معاً.",
      86: "التشريع المنظّم لحق المؤلف في مصر هو القانون رقم 82 لسنة 2002 بشأن حماية حقوق الملكية الفكرية.",
      87: "محل الحماية القانونية هو الابتكار الموجود في المصنف (نتاج الذهن والأفكار الجديدة)، لا المادة المادية للمصنف.",
      88: "من ينشر المصنف باسم مستعار دون شك في هويته يُعدّ مؤلفاً بموجب القرينة القانونية المقررة في القانون.",
      89: "من يدّعي أن من ذكر اسمه ليس المؤلف الحقيقي عليه إثبات ذلك بكافة طرق الإثبات، لأنه يدّعي واقعة مادية.",
      90: "المصنف الجماعي يستحيل فصل عمل كل مؤلف فيه، خلافاً للمصنف المشترك الذي قد يمكن فصل نصيب كل مؤلف.",
      91: "التفويض لازم فقط إذا نُشر المصنف دون اسم المؤلف أو باسم مستعار مع الشك في هويته، لا إذا ذُكر اسمه صراحةً.",
      92: "الناشر المفوض وكيل عن المؤلف وملزم بتقديم كشف حساب عن كل ما باشره نيابةً عنه.",
      93: "المؤلف يحتفظ دائماً بحق إتاحة مصنفه للجمهور لأول مرة حتى بعد التنازل عن حقوقه المالية للغير.",
      94: "يُحمي المشرع المصري المصنفات أياً كان نوعها أو شكلها أو الغرض منها، بشرط توافر الابتكار.",
      95: "لا تثبت الحماية القانونية إلا إذا توافر الركنان معاً: الشكلي (الصورة المادية) والموضوعي (الابتكار).",
      96: "حقوق الملكية الفكرية سلطات على شيء غير مادي هو نتاج الذهن والأفكار الجديدة، وليس الشيء المادي ذاته.",
      97: "لا يحق للناشر أو المنتج ذكر اسمه مؤلفاً للمصنف، بل يكون ممثلاً للمؤلف الحقيقي عند الشك في هويته.",
      98: "النشر باسم مستعار لا يسلب المؤلف صفته إذا لم يكن ثمة شك في معرفة شخصيته الحقيقية.",
      99: "عند الشك في معرفة المؤلف الحقيقي، يُعتبر الناشر أو المنتج ممثلاً للمؤلف مؤقتاً حتى يُعرَّف المؤلف الحقيقي.",
      100: "القرينة قانونية بسيطة تقبل إثبات العكس، وليست قاطعة؛ فمن يدّعي خلافها يستطيع إثبات ذلك.",
      101: "وذكر الاسم على المصنف يُقيم قرينة قانونية بسيطة تقبل إثبات العكس بكافة طرق الإثبات.",
      102: "المؤلف قد يكون طبيعياً أو اعتبارياً وفق قانون حماية الملكية الفكرية رقم 82 لسنة 2002.",
      103: "لا يُشترط في المؤلف أن يكون شخصاً طبيعياً؛ يجوز للشخص الاعتباري أن يكون مؤلفاً لا سيما في المصنف الجماعي.",
      104: "المصنف الجماعي يمكن أن يكون تحت إشراف شخص طبيعي أو اعتباري، وكلاهما يحق له مباشرة حقوق المؤلف.",
      105: "إذا نُشر المصنف دون اسم مؤلفه الحقيقي مع الشك في هويته، وجب تحديد شخص يُباشر الحقوق المالية والأدبية.",
      106: "القرينة المقررة لصالح الناشر ليست مطلقة؛ يجوز للمؤلف تفويض شخص آخر غير الناشر ويُفضي ذلك إلى نقض القرينة.",
      107: "القرينة تجعل الناشر المفوّض الافتراضي، إلا إذا اتفق المؤلف على تفويض شخص آخر بدلاً منه.",
      108: "تفويض الناشر ليس وجوبياً؛ للمؤلف الحق في تفويض أي شخص آخر ويظل الناشر ناشراً فقط.",
      109: "المفوّض يُباشر كل حقوق المؤلف: المالية (نشر، توزيع، تعاقد) والأدبية (منع الاعتداء، نسبة المصنف).",
      110: "المفوّض يُباشر الحقوق المالية والأدبية معاً، لا المالية وحدها؛ فهو وكيل شامل عن المؤلف.",
      111: "المفوّض وكيل عن المؤلف ملزم بتقديم حسابات عن كل ما باشره، وأداء المبالغ المقبوضة، ونقل الحقوق المكتسبة.",
      112: "المصنف نتاج فكر المؤلف، ولذا لا يجوز التنازل عن صفة المؤلف ذاتها (الحق الأدبي) لأي شخص.",
      113: "الحق في إتاحة المصنف للجمهور لأول مرة حق أدبي يبقى للمؤلف وخلفه العام حتى بعد التنازل عن الحقوق المالية.",
      114: "حق إتاحة المصنف للجمهور حق أدبي مطلق يُعتبر العقد متضمناً له ولو لم يُنص عليه صراحةً.",
      115: "التعديل بالترجمة لا يُعدّ اعتداءً دائماً؛ يصبح اعتداءً فقط عند إغفال الإشارة للحذف أو الإساءة لسمعة المؤلف.",
      116: "قيام المترجم بتعديل المصنف لا يُعدّ اعتداءً إلا إذا أغفل مواطن الحذف أو أساء لمكانة المؤلف.",
      117: "الحق الأدبي من الحقوق اللصيقة بالشخصية التي تخرج عن دائرة التعامل ولا يجوز التنازل عنها أو الحجز عليها.",
      118: "يجوز للمؤلف التنازل عن كل أو بعض حقوقه المالية للغير بموجب عقد مكتوب يُحدد كل حق بالتفصيل.",
      119: "التنازل عن الحق المالي لا يمس الحق الأدبي؛ فيظل المؤلف يحتفظ بحق نشر مصنفه للجمهور ولو لأول مرة.",
      120: "التنازل عن الحق المالي لا يحرم المؤلف من حق نشر مصنفه؛ هذا الحق الأدبي يظل ثابتاً له دائماً.",
      121: "الركن الشكلي: إفراغ المصنف في صورة مادية بلغت حداً من الاستقرار وكانت معدة للنشر، لا مجرد فكرة في الذهن.",
      122: "الركن الموضوعي للمصنف هو الابتكار: الطابع الإبداعي الذي يُسبغ الأصالة ويُميّز المصنف عن غيره.",
      123: "محل الحماية القانونية هو الابتكار (الركن الموضوعي)، وهو الثمن الذي تُشترى به الحماية القانونية للمصنف.",
      124: "حماية عنوان المصنف مشروطة بشرطين: أن يكون مبتكراً، وألا يكون مجرد لفظ يُوضّح موضوع المصنف.",
      125: "لا تمتد الحماية لأي عنوان تلقائياً؛ يُشترط أن يكون العنوان مبتكراً وليس مجرد وصف للموضوع.",
      126: "أغنية 'الأطلال' من الأمثلة المشهورة على العناوين المبتكرة المحمية في مجال المصنفات الموسيقية الغنائية.",
      127: "المصنف الجماعي: يضعه أكثر من مؤلف تحت إشراف شخص طبيعي أو اعتباري، ويستحيل فصل عمل كل مؤلف.",
      128: "في المصنف الجماعي، الشخص الذي وجّه الابتكار (طبيعياً أو اعتبارياً) هو مؤلفه الوحيد ويُباشر جميع الحقوق.",
      129: "الشخص الاعتباري في المصنف الجماعي: حماية الحقوق المالية 50 سنة من تاريخ النشر أو الإتاحة لأول مرة.",
      130: "الشخص الطبيعي: الحماية تمتد طيلة حياته ثم 50 سنة بعد وفاته، ولا تنتهي بمجرد وفاته.",
      131: "الشخص الطبيعي في المصنف الجماعي: حماية طيلة الحياة + 50 سنة بعد الوفاة.",
      132: "المصنف المشترك (لا الجماعي) هو الذي يُوضع بتعاون عدة أشخاص سواء أمكن فصل نصيب كل منهم أم لا.",
      133: "المصنف المشترك يتميز بالتعاون دون إشراف مركزي، وقد يمكن أو لا يمكن فصل نصيب كل مؤلف.",
      134: "إذا تعذّر فصل نصيب كل مؤلف في المصنف المشترك، اعتُبر جميعهم أصحاب الحق بالتساوي (بالكتابة).",
      135: "التساوي في المصنف المشترك قابل للاتفاق بخلافه، لكن يجب أن يكون هذا الاتفاق مكتوباً لا شفهياً.",
      136: "الاتفاق على توزيع الحقوق في المصنف المشترك يجب أن يكون مكتوباً؛ الاتفاق الشفهي غير مُعتدٍّ به.",
      137: "إذا تعذّر فصل نصيب كل مؤلف في المصنف المشترك، يُشترط الإجماع (لا الأغلبية) لمباشرة الحقوق.",
      138: "مباشرة الحقوق في المصنف المشترك المتعذّر فيه الفصل تستلزم إجماع جميع الآراء، لا مجرد الأغلبية.",
      139: "لأحد المؤلفين في المصنف المشترك الانفراد بمباشرة الحقوق فيما يخص نصيبه المتميز فقط، دون مساس بالمصنف ككل.",
      140: "المطرب والممثل لا يُعدّان مؤلِّفَين ولا شريكَين للمؤلفين في المصنف الموسيقي، وإن كان لهم حق الأداء.",
      141: "حق عرض المصنف السمعي البصري يعود لمن وضعوه وحوّروه ومؤلفي السيناريو والحوار والمخرج.",
      142: "لكل شريك في المصنف السمعي البصري الحق في الاستغلال المنفرد لمصنفه الأصلي بطريقة أخرى ما لم يُتفق على خلاف ذلك.",
      143: "إذا امتنع أحد الشركاء عن إتمام نصيبه، لباقي الشركاء استعمال ما أنجزه دون الحاجة لموافقته.",
      144: "يجوز إذاعة المصنفات السمعية والبصرية بقرار الهيئات الرسمية تغليباً للصالح العام، مع التزام تعويض المؤلف.",
      145: "نشر الصور دون إذن صاحبها ليس مطلقاً؛ مقيّد بشروط وحالات محددة يستثنيها القانون.",
      146: "يجوز نشر الصورة دون إذن صاحبها إذا كان النشر بصدد حوادث وقعت علناً، كالتصريحات والأحداث العامة.",
      147: "العبارة خاطئة في شقّها الثاني. الشق الأول صحيح: لا يجوز للمصور نشر الصورة دون إذن صاحبها. لكن الشق الثاني خاطئ: لا يجوز لصاحب الصورة نشرها دون إذن المصور، لأن المصور هو صاحب حق الملكية الفكرية على الصورة بوصفها مصنفاً.",
      148: "الوثائق الرسمية (قوانين، لوائح، أحكام) لا تخضع لحماية حق المؤلف؛ الاطلاع عليها حق عام للجميع.",
      149: "إذا جمّع شخص نصوص القوانين وبوّبها وأضاف ترتيباً مبتكراً، أصبح هذا التجميع مصنفاً محمياً.",
      150: "الراجح فقهاً وقضاءً أن حق الملكية الفكرية حق مزدوج الطبيعة: مالي وأدبي، وكل منهما له أحكامه الخاصة.",
      151: "من شروط الاختراع الجديد: ألا يسبق طلب براءة عنه أو عن جزء منه في مصر أو الخارج قبل تاريخ الطلب.",
      152: "الاختراع الذي سبق استعماله أو استغلاله علناً أو أُفصح عن وصفه لا يُعدّ جديداً ولا يُمنح براءة.",
      153: "الاستغلال الصناعي في مجال براءات الاختراع يُفسَّر بالمعنى الواسع، يشمل كل استغلال اقتصادي ولو غير صناعي.",
      154: "الاستغلال في مجال الاختراع يشمل كل استغلال اقتصادي ولو لم يكن صناعياً بالمعنى الضيق.",
      155: "عند التوصل للاختراع بصورة مستقلة من عدة أشخاص، يثبت الحق للأسبق في تقديم طلب البراءة لا للجميع بالتساوي.",
      156: "مبدأ الأسبقية في طلب البراءة: من يتقدم أولاً بطلبه يحصل على براءة الاختراع عند التزامن.",
      157: "الورثة لا يرثون الحق في نسبة المصنف إليهم، بل يرثون فقط الحق في منع التشويه والتحريف للمصنف.",
      158: "الورثة يرثون الجانب الوقائي من الحق الأدبي: منع تشويه مصنف مورثهم أو تحريفه.",
      159: "عند وفاة المؤلف ينتقل حق إتاحة المصنف للخلف العام، وإذا لم يوجد وارث تضطلع بذلك الوزارة المختصة.",
      160: "العبارة خاطئة. إعطاء المصنف لبعض الأصدقاء أو الأقارب لأخذ الرأي لا يُعدّ نشراً قانونياً بأي حال؛ النشر يستلزم إتاحة المصنف للجمهور (عدد غير محدود من الأشخاص) بموافقة المؤلف، وهو ما لا يتحقق بمجرد إعطائه لأفراد بعينهم.",
      161: "لا يجوز لأحد (بما فيهم الناشر) التعديل في المصنف بحذف أو إضافة دون إذن المؤلف؛ هذا حق أدبي محفوظ.",
      162: "السحب من التداول حق للمؤلف وحده، ويلزمه تعويض من آلت إليه حقوق الاستغلال المالي مسبقاً.",
      163: "في المصنف المشترك، السحب من التداول يستلزم إجماع جميع الشركاء لا انفراد أحدهم.",
      164: "لا يجوز للورثة سحب المصنف من التداول حتى وإن نشروه لأول مرة؛ هذا الحق للمؤلف وحده.",
      165: "الحق المالي للمؤلف مؤقت لا دائم؛ ينقضي بمرور 50 سنة من وفاة المؤلف ثم ينتقل المصنف للملك العام.",
      166: "التصرف في الإنتاج الفكري المستقبلي باطل بطلاناً مطلقاً؛ لا يجوز التنازل عن مصنفات لم تُوجَد بعد.",

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // ── شاشة البداية ─────────────────────────────────────────
    function toggleAccordion(id) {
       categories.forEach(item => {
           if (item.isGroup) {
               const elWrap = document.getElementById(item.groupId + '-wrapper');
               const icon = document.getElementById('icon-' + item.groupId);
               if (item.groupId === id) {
                   if (elWrap.classList.contains('open')) {
                       elWrap.classList.remove('open');
                       icon.classList.remove('-rotate-180');
                   } else {
                       elWrap.classList.add('open');
                       icon.classList.add('-rotate-180');
                   }
               } else {
                   elWrap.classList.remove('open');
                   icon.classList.remove('-rotate-180');
               }
           }
       });
    }

      let pool = [];
      if (secId === 0) {
        pool = allQuestions;
      } else if (Array.isArray(secId)) {
        pool = allQuestions.filter(q => secId.includes(q.sec));
      } else {
        pool = allQuestions.filter(q => q.sec === secId);
      }
        
      // الترتيب العشوائي للأسئلة
      filteredQuestions = shuffle(pool);
      // الترتيب العشوائي للاختيارات داخل الأسئلة (اختياري، لكن لتحسين التجربة)
      filteredQuestions.forEach(q => {
          if(q.options.length > 2) {
              const originalOptions = [...q.options];
              const correctAnswerRaw = originalOptions[q.correct];
              q.options = shuffle(q.options);
              q.correct = q.options.indexOf(correctAnswerRaw);
          }
      });
      
      currentIdx = 0;
      answers = {};
      view = 'quiz';
      render();
    }

    function answerQuestion(idx) {
      const q = filteredQuestions[currentIdx];
      if (!answers.hasOwnProperty(q.id)) {
        answers[q.id] = idx;
        render();
      }
    }

    function nextQuestion() {
      if (currentIdx < filteredQuestions.length - 1) {
        currentIdx++;
        render();
      } else {
        view = 'results';
        render();
      }
    }

    function prevQuestion() {
      if (currentIdx > 0) {
        currentIdx--;
        render();
      }
    }

    function goToStart() {
      view = 'start';
      render();
    }

    // ── عرض السؤال ───────────────────────────────────────────
    function renderQuiz() {
      if (filteredQuestions.length === 0) {
        container.innerHTML = '<div class="text-center p-10 font-bold">لا توجد أسئلة.</div>';
        return;
      }

      const q = filteredQuestions[currentIdx];
      const isAnswered = answers.hasOwnProperty(q.id);
      
      let secLabel = 'اختبار شامل';
      if (Array.isArray(currentSec)) {
        secLabel = 'اختبار شامل للقسم';
      } else if (currentSec !== 0) {
        secLabel = sections.find(s => s.id === currentSec)?.label || '';
      }

      let html = `
        <div class="flex flex-col mb-8 animate-fade-in" style="animation-delay: 0.1s">
          <div class="flex justify-between items-center mb-6 text-sm font-bold text-[var(--text-secondary)]">
            <span>السؤال رقم ${currentIdx + 1} من ${filteredQuestions.length}</span>
            <div class="flex items-center gap-2">
              <div class="bg-[var(--card-bg)] border border-[var(--pill-border)] text-[var(--text-main)] px-3 py-1 rounded-full text-xs shadow-sm">
                ${secLabel}
              </div>
              <button onclick="goToStart()" title="القائمة الرئيسية" class="home-icon-btn">
                <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><polyline points="9 21 9 12 15 12 15 21"/></svg>
              </button>
            </div>
          </div>
          <div class="bg-[var(--card-bg)] shadow-[var(--shadow-soft)] rounded-2xl p-6 mb-4 relative">
            <h3 class="text-xl font-bold leading-relaxed mb-6">${q.text}</h3>
            <div class="flex flex-col gap-3">
      `;

      q.options.forEach((opt, idx) => {
        let btnClass = "bg-[var(--pill-bg)] border border-[var(--pill-border)] text-[var(--text-main)] hover:bg-[var(--hover-bg)] hover:-translate-y-0.5 shadow-sm";
        let iconHtml = '';
        const disabledAttr = isAnswered ? 'disabled' : '';
        if (isAnswered) {
          if (idx === q.correct) {
            btnClass = "bg-green-500/10 border-green-500 text-green-700 dark:text-green-400 cursor-default";
            iconHtml = '<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
          } else if (answers[q.id] === idx) {
            btnClass = "bg-red-500/10 border-red-500 text-red-700 dark:text-red-400 cursor-default";
            iconHtml = '<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
          } else {
            btnClass = "bg-[var(--pill-bg)] border border-[var(--pill-border)] text-[var(--text-secondary)] opacity-40 cursor-default";
          }
        }
        html += `
          <button onclick="answerQuestion(${idx})" ${disabledAttr} class="text-[0.95rem] py-3 px-5 text-right w-full flex justify-between items-center rounded-xl transition-all font-semibold ${btnClass}">
            <span>${opt}</span>${iconHtml}
          </button>
        `;
      });

      html += `</div>`;

      // شرح / تصحيح بعد الإجابة
      if (isAnswered && q.rationale) {
        html += `
          <div class="mt-4 p-4 rounded-xl text-sm font-semibold flex gap-2 items-start" style="background:var(--rationale-bg);border:1px solid var(--rationale-border);color:var(--rationale-text);">
            <svg class="mt-0.5 shrink-0" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color:var(--rationale-icon);"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span>${q.rationale}</span>
          </div>
        `;
      }

      html += `</div>`;

      html += `
        <div class="flex justify-between items-center">
          <button onclick="prevQuestion()" ${currentIdx === 0 ? 'disabled' : ''} class="font-bold rounded-full px-6 py-3 flex items-center gap-2 ${currentIdx === 0 ? 'bg-[var(--pill-border)] text-[var(--text-secondary)] cursor-not-allowed opacity-40' : 'bg-[var(--card-bg)] border border-[var(--pill-border)] text-[var(--text-main)] hover:bg-[var(--hover-bg)] hover:-translate-y-1 hover:shadow-md shadow-sm active:scale-95'}">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
            السابق
          </button>
          <button onclick="nextQuestion()" ${!isAnswered ? 'disabled' : ''} class="font-bold rounded-full px-8 py-3 ${isAnswered ? 'bg-[var(--madar-color)] text-white hover:opacity-90 hover:-translate-y-1 hover:shadow-lg shadow-md active:scale-95' : 'bg-[var(--pill-border)] text-[var(--text-secondary)] cursor-not-allowed opacity-50'}">
            ${currentIdx < filteredQuestions.length - 1 ? 'السؤال التالي' : 'إنهاء الاختبار'}
          </button>
        </div>
      </div>`;

      container.innerHTML = html;
    }

    // ── النتائج ───────────────────────────────────────────────
    function renderResults() {
      let earned = 0;
      const total = filteredQuestions.length;
      filteredQuestions.forEach(q => { if (answers[q.id] === q.correct) earned++; });
      const pct = Math.round((earned / total) * 100) || 0;
      
      let secLabel = 'اختبار شامل';
      if (Array.isArray(currentSec)) {
        secLabel = 'اختبار شامل للقسم';
      } else if (currentSec !== 0) {
        secLabel = sections.find(s => s.id === currentSec)?.label || '';
      }

      container.innerHTML = `
        <div class="flex flex-col items-center mb-10 animate-fade-in">
          <h2 class="text-3xl font-black mb-2 text-[var(--madar-color)]">النتيجة النهائية</h2>
          <p class="text-[var(--text-secondary)] font-bold mb-6">${secLabel}</p>
          <div class="bg-[var(--card-bg)] border border-[var(--pill-border)] rounded-3xl p-8 mb-8 text-center shadow-[var(--shadow-soft)] w-full max-w-sm">
            <div class="text-[4.5rem] font-bold leading-none mb-1 text-[var(--text-main)] font-mono">${pct}<span class="text-3xl text-[var(--text-secondary)]">%</span></div>
            <div class="text-lg font-bold text-[var(--text-secondary)] mb-6">معدل الإنجاز</div>
            <div class="h-px w-full bg-[var(--divider-color)] my-6"></div>
            <div class="flex justify-center items-center gap-3 text-[1.1rem] font-bold text-[var(--text-main)]">
              <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-500"><polyline points="20 6 9 17 4 12"></polyline></svg>
              الإجابات الصحيحة: <span dir="ltr" class="font-mono font-bold">${earned} / ${total}</span>
            </div>
          </div>
          <div class="flex gap-3 flex-wrap justify-center">
            <button onclick='startQuiz(${JSON.stringify(currentSec)})' class="bg-[var(--madar-color)] hover:opacity-90 text-white font-bold rounded-full px-8 py-3 text-lg transition-all shadow-md active:scale-95">إعادة القسم</button>
            <button onclick="goToStart()" class="bg-[var(--card-bg)] border border-[var(--pill-border)] text-[var(--text-main)] hover:bg-[var(--hover-bg)] font-bold rounded-full px-8 py-3 text-lg transition-all shadow-sm">قسم آخر</button>
          </div>
        </div>
      `;

      if (pct >= 80) {
        setTimeout(() => {
          const end = Date.now() + 3000;
          const colors = ['#2e7d32','#2ecc71','#f59e0b','#fcd34d'];
          (function frame() {
            confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors });
            confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors });
            if (Date.now() < end) requestAnimationFrame(frame);
          }());
        }, 300);
      }
    }

    // ── الثيم ─────────────────────────────────────────────────
    const themeToggle = document.getElementById('theme-toggle');
    const iconSun  = document.getElementById('icon-sun');
    const iconMoon = document.getElementById('icon-moon');

    function updateThemeUI() {
      const dark = document.documentElement.classList.contains('dark');
      iconSun.classList.toggle('hidden', !dark);
      iconMoon.classList.toggle('hidden', dark);
    }

    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      updateThemeUI();
    });

    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
    updateThemeUI();

    render();
  </script>
</body>
</html>
