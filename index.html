let currentQuestions = [];
let currentIndex = 0;
let userAnswers = [];
let timerSeconds = 0;
let timerInterval;
let quizFinished = false;

function startQuiz(id) {
  currentQuestions = sectionsData[id].questions;
  currentIndex = 0;
  userAnswers = new Array(currentQuestions.length).fill(null);
  timerSeconds = 0;
  quizFinished = false;
  document.getElementById('homeSection').style.display = 'none';
  document.getElementById('quizSection').style.display = 'block';
  renderQuestion();
  startTimer();
}

function renderQuestion() {
  const q = currentQuestions[currentIndex];
  document.getElementById('qNumDisplay').textContent = currentIndex + 1;
  document.getElementById('qTextDisplay').textContent = q.text;
  document.getElementById('questionCounter').textContent = `السؤال ${currentIndex+1} / ${currentQuestions.length}`;
  let html = '';
  q.options.forEach((opt, i) => {
    const checked = (userAnswers[currentIndex] === i) ? 'checked' : '';
    html += `<div class="option-row" data-optidx="${i}">
               <input type="radio" name="q" value="${i}" ${checked}>
               <label>${String.fromCharCode(65+i)}) ${opt}</label>
             </div>`;
  });
  document.getElementById('mcOptions').innerHTML = html;
  updateButtons();
}

function selectOption(optIdx) {
  if (userAnswers[currentIndex] !== null) return;
  userAnswers[currentIndex] = optIdx;
  // تحديث واجهة الاختيار
  const rows = document.querySelectorAll('.option-row');
  rows.forEach((row, idx) => {
    const radio = row.querySelector('input');
    if (idx === optIdx) {
      radio.checked = true;
    } else {
      radio.checked = false;
    }
  });
  // الانتقال للسؤال التالي إذا لم يكن الأخير
  if (currentIndex < currentQuestions.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    // إذا كان آخر سؤال، ننتهي
    updateButtons();
  }
}

function updateButtons() {
  const isLast = (currentIndex === currentQuestions.length - 1);
  document.getElementById('nextBtn').style.display = isLast ? 'none' : 'inline-block';
  document.getElementById('finishBtn').style.display = isLast ? 'inline-block' : 'none';
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!quizFinished) {
      timerSeconds++;
      const m = Math.floor(timerSeconds / 60);
      const s = timerSeconds % 60;
      document.getElementById('timerDisplay').textContent = `⏱️ ${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }
  }, 1000);
}

function stopTimer() {
  quizFinished = true;
  if (timerInterval) clearInterval(timerInterval);
}

function finishQuiz() {
  stopTimer();
  let correct = 0;
  for (let i = 0; i < currentQuestions.length; i++) {
    if (userAnswers[i] !== null && userAnswers[i] === currentQuestions[i].correct) correct++;
  }
  document.getElementById('quizSection').style.display = 'none';
  document.getElementById('resultSection').style.display = 'block';
  document.getElementById('finalScoreDisplay').textContent = `${correct} / ${currentQuestions.length}`;
  const percent = Math.round((correct / currentQuestions.length) * 100);
  document.getElementById('percentageDisplay').textContent = `${percent}%`;
}

function goPrev() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
  }
}

function goNext() {
  if (currentIndex < currentQuestions.length - 1) {
    currentIndex++;
    renderQuestion();
  }
}

// ربط الأحداث
document.querySelectorAll('.section-card[data-section]').forEach(card => {
  card.addEventListener('click', () => startQuiz(card.dataset.section));
});
document.getElementById('prevBtn').addEventListener('click', goPrev);
document.getElementById('nextBtn').addEventListener('click', goNext);
document.getElementById('finishBtn').addEventListener('click', finishQuiz);
document.getElementById('mainPageLinkBtn').addEventListener('click', () => {
  window.location.href = "https://COFFEE595.github.io/MADAR/index.html";
});

// تفويض أحداث خيارات الأسئلة (لأنها تُنشأ ديناميكياً)
document.getElementById('mcOptions').addEventListener('click', (e) => {
  const optionRow = e.target.closest('.option-row');
  if (optionRow) {
    const optIdx = parseInt(optionRow.dataset.optidx);
    if (!isNaN(optIdx)) selectOption(optIdx);
  }
});

// الوضع الليلي
const savedTheme = localStorage.getItem('pol_theme') || 'light';
if (savedTheme === 'dark') {
  document.body.classList.add('dark');
  document.getElementById('toggleThemeBtn').textContent = '☀️';
} else {
  document.getElementById('toggleThemeBtn').textContent = '🌙';
}
document.getElementById('toggleThemeBtn').addEventListener('click', () => {
  const isDark = document.body.classList.contains('dark');
  if (isDark) {
    document.body.classList.remove('dark');
    localStorage.setItem('pol_theme', 'light');
    document.getElementById('toggleThemeBtn').textContent = '🌙';
  } else {
    document.body.classList.add('dark');
    localStorage.setItem('pol_theme', 'dark');
    document.getElementById('toggleThemeBtn').textContent = '☀️';
  }
});
</script>
