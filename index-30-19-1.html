/* ── Float Orb ── */
.float-orb {
    position: relative;
    z-index: 10;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #fbbf24 0%, #d97706 60%, #b45309 100%);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    transition: transform 0.18s ease, box-shadow 0.18s ease, width 0.22s ease, height 0.22s ease;
    box-shadow: 0 0 0 2px #fff, 0 4px 14px #f59e0b55, 0 2px 4px #0000002a;
}
.float-orb.open {
    width: 54px;
    height: 54px;
    box-shadow: 0 0 0 4px #fff, 0 8px 24px #f59e0b55, 0 2px 6px #0000002a;
}
.dark .float-orb { box-shadow: 0 0 0 2px #1e293b, 0 6px 20px #f59e0b44, 0 2px 8px #00000040; }
.dark .float-orb.open { box-shadow: 0 0 0 3px #1e293b, 0 8px 28px #f59e0b44, 0 2px 8px #00000040; }
.float-orb:hover { transform: scale(1.07); box-shadow: 0 0 0 4px #fff, 0 12px 32px #f59e0b66, 0 2px 8px #0000002a; }
.float-orb:active { transform: scale(0.94); }
.float-orb-glow {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #fbbf24, #f59e0b, #d97706, #fbbf24);
    opacity: 0;
    transition: opacity 0.3s ease;
    animation: orb-spin 3s linear infinite;
    z-index: -1;
}
.float-orb-ring {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1.5px solid #fbbf2440;
    animation: orb-pulse 2.5s ease-in-out infinite;
}
@keyframes orb-spin { to { transform: rotate(360deg); } }
@keyframes orb-pulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.18); opacity: 0; }
}
.float-orb:hover .float-orb-glow { opacity: 0.55; }
.float-orb-icon { display: flex; align-items: center; justify-content: center; }

                    <h3>ثانياً: جواز التنازل عن الحق المالي للمؤلف:</h3>
                    <p>تقرر المادة 149 من قانون حماية حقوق الملكية الفكرية أنه <strong>"للمؤلف أن ينقل إلى الغير كل أو بعض حقوقه المالية المبينة في هذا القانون"</strong>. ويشترط لانعقاد التصرف أن يكون مكتوباً وأن يحدد فيه صراحة وبالتفصيل كل حق على حدة يكون محلاً للتصرف مع بيان مداه والغرض منه ومدة الاستغلال ومكانه ويكون المؤلف مالكاً لكل ما لم يتنازل عنه صراحة من حقوق مالية. ولا يعد ترخيصه باستغلال أحد هذه الحقوق ترخيصاً منه باستغلال أي حق مالي آخر يتمتع به على المصنف نفسه. ومع عدم الإخلال بحقوق المؤلف الأدبية المنصوص عليها في هذا القانون يمتنع عليه القيام بأي عمل من شأنه تعطيل استغلال الحق محل التصرف.</p>
                    <p>نشير هنا إلى أنه إذا كان لا يجوز للمؤلف أن يتنازل عن مؤلفه لغيره بنسبته إليه وكذلك لا يجوز التنازل عن الحق الأدبي للمؤلف لغيره، لأن الحق الأدبي أمر لصيق بصفة المؤلف. فإنه يجوز التنازل عن حق الاستغلال المالي الذي يثبت للمؤلف باعتباره حقاً مالياً. وحتى مع التنازل عن الحق المالي للمؤلف لغيره، فإن ذلك لا يؤثر على حق المؤلف ذاته في نشر مصنفه على الجمهور ولو لأول مرة حيث احتفظ المشرع للمؤلف بحقه الأدبي في نشر مصنفه لأول مرة حتى ولو لم يتم النص عليه صراحة في عقد الاستغلال المالي بين المؤلف والمتنازل إليه. إذ كانت الحقوق المالية تستهدف حماية حق المالك في الاستحواذ وحده على محل الحق والاستئثار به فإن الملكية الفكرية على النقيض من ذلك وقد تؤتي ثمارها بالانتشار لا بالاستئثار. وقد تهدف في الأساس إلى تمكين المؤلف وحماية حقه في نشر وعرض أفكاره على أكبر مجموع من الناس فالأصل أن المصنف معد للجمهور وموجه إليه ومتى قدر المؤلف صلاحيته للنشر فلا يجوز مصادرة هذا الحق بترك أمر عرض المصنف أو حجبه عن الجمهور المطلق لمشيئة من يتنازل له المؤلف عن حقوقه المالية. لذلك حرص المشرع على النص على حق إتاحة المصنف للجمهور لأول مرة في صدر الحقوق الأدبية وهذا الحق يظل ثابتاً للمؤلف وخلفه العام ولو نزل للغير عن حقوقه المالية ويعتبر العقد متضمناً له ولو خلا من اشتراطه. ولا يجوز حرمانهم من هذا الحق مما مقتضاه أن من تنتقل إليه الحقوق المالية للمؤلف يكون دائماً ملتزماً بإتاحة المصنف للجمهور فإذا لم يعرضه في الأجل المتفق عليه أو خلال مدة معقولة من تاريخ التعاقد في حالة عدم الاتفاق على أجل محدد لذلك كان مخلاً بالتزامه ومسئولاً أمام المؤلف ويجوز له ولخلفه العام طلب فسخ العقد.</p>

                    <h2>تعريف المصنفات المحمية قانوناً</h2>
                    <p>المصنفات: هي <strong>"نتاج ابتكار الفكر والعقل البشري، لذا وجب على المشرع توفير الحماية القانونية لها، فكل عمل مبتكر أياً كان نوعه أو شكله أو الغرض منه يتمتع بالحماية القانونية احتراماً لابتكار وإبداع مؤلفه"</strong>.</p>

                    <h3>تعريف المصنف وركنا الحماية:</h3>
                    <p>عرف المشرع المصنف: بكونه <strong>"كل عمل مبتكر، أدبي أو فني أو علمي أياً كان نوعه أو طريقة التعبير عنه أو أهميته أو الغرض من تصنيفه"</strong>، أو هو ابتكار الذهن البشري، ولكي يتمتع مؤلفه بحماية القانون يجب أن يستوفي المصنف ركناً شكلياً وركناً موضوعياً.</p>

                    <h3>أولاً: الركن الموضوعي</h3>
                    <p>ألا يكون العمل مكرراً في صورته وأن يحمل ما يميزه. ويتمثل في احتوائه على نوع من الابتكار، بحيث يظهر من خلاله شخصية مؤلفه. فكما يقول البعض أن الابتكار هو الأساس الذي تقوم عليه حماية القانون، وهو الثمن الذي تشتري به تلك الحماية. بمفهوم المخالفة فالمصنف الذي لا يحمل طابعاً شخصياً لمؤلفه أو لا يظهر فيه عنصر الابتكار يكون غير جدير بالحماية القانونية. وعرف المشرع بقانون حماية حقوق الملكية الفكرية الابتكار بكونه <strong>"الطابع الإبداعي الذي يسبغ الأصالة على المصنف"</strong>. جوهر حقوق الملكية الفكرية يتمثل في الابتكار والإبداع في شتى مناحي النشاط الإنساني، وكلاهما يعدان نمطاً من أنماط التفكير ومستوى متقدماً في سلم القدرات الذهنية للإنسان وهو ما يميز صاحبه عن غيره من بني البشر. ويستفاد من ذلك أن المشرع قد أضفى الحماية القانونية لمؤلفي المصنفات أياً كان نوعها أو طريقة التعبير عنها أو أهميتها أو الغرض منها. بشرط أن يكون هذا المصنف قد انطوى على شيء من الابتكار بحيث يبين منه أن المؤلف أظهر من خلال مصنفه شخصيته. وأن يتم إفراغ هذا المصنف في صورة مادية يبرز فيها إلى الوجود ويكون معداً للنشر، وبغير ذلك فلا يرقى إلى مرتبة المصنف الجدير بالحماية. ويظهر عنصر الابتكار من خلال الطابع الشخصي الذي يعطيه المؤلف لمصنفه، والذي يسمح من خلاله بتمييز المصنف عن سواه من المصنفات التي تنتمي إلى ذات النوع، حيث تبرز شخصية المؤلف إما في مقومات الفكرة التي عرضها أو في الطريقة التي اتخذها لعرض الفكرة. فالأمر الجوهري هنا هو تميز الإنتاج الذهني بطابع معين يبرز شخصية صاحبه سواء في جوهر الفكرة المعروضة أو في مجرد طريقة العرض أو التعبير أو الترتيب أو التبويب أو الأسلوب. قضت محكمة النقض بأنه <em>"المقرر أن الابتكار كأساس تقوم عليه حماية القانون للمصنف هو الطابع الشخصي الذي يعطيه المؤلف لمؤلفه، إذ يكفي أن يضفي على فكرة ولو كانت قديمة شخصيته فيضفي على مصنفه طابعاً إبداعياً يسبغ عليه أصالة تميزه عن غيره"</em>.</p>
                    <p>وأن معنى المؤلف ليس مقصوراً على المعنى الضيق المتمثل في تأليف كتاب وإنما يشمل كل صور الابتكار لأي نوع من المصنفات، لكن لا تشمل الحماية مجرد الأفكار والإجراءات وأساليب العمل وطرق التشغيل والمفاهيم والمبادئ والاكتشافات والبيانات ولو كان معبراً عنها أو موصوفة أو موضحة أو مدرجة في مصنف. وقضت محكمة النقض بأنه: <em>"النص في المادة 140 من ذات القانون على أن تتمتع بحماية هذا القانون حقوق المؤلفين على مصنفاتهم الأدبية والفنية وبوجه خاص المصنفات الآتية - الكتاب، والكتيبات والمقالات والنشرات وغيرها من المصنفات المكتوبة... وبغير ذلك فلا يرقى إلى مرتبة المصنف الجدير بالحماية. فإن جوهر حقوق الملكية الفكرية أنها ثمرة الابتكار ونتاج الإبداع في شتى مناحي النشاط الإنساني، ويعبر التفكير الإبداعي عن نفسه في صورة إنتاج شيء جديد أو الخروج عن المألوف أو ميلاد شيء جديد سواء كان فكرة أم اكتشافاً أم اختراعاً. وتبرز أهمية الإبداع في أنه يمثل إطلاقاً لطاقات الخلق والاجتهاد دون قيد على العقل إلى الحد الذي ينال فيه المجتهد أجراً حتى لو أخطأ، بشرط الالتزام بإطار أخلاقي وإنساني لا يحكمه الهوى، وإنما يحكمه الضمير، لكي يكون ملائماً وهادفاً إلى دعم القيم الإنسانية وأن الدلالة الاصطلاحية لابتكار الشيء في اللغة هو الاستيلاء على باكورته، بمعنى أن يكون وليد أفكار المرء بالمبادرة إليه وإدراك أوله متسماً بالحداثة والإبداع وبطابعه الشخصي. ويقصد بالابتكار في نطاق الحماية القانونية لحق المؤلف الطابع الشخصي الذي يعطيه المؤلف لمصنفه، الذي يسمح بتمييز المصنف عن سواه من المصنفات التي تنتمي إلى ذات النوع، حيث تبرز شخصية المؤلف إما في مقومات الفكرة التي عرضها أو في الطريقة التي اتخذها لعرض الفكرة. فالجوهري في الأمر هو تميز الإنتاج الذهني بطابع معين يبرز شخصية صاحبه سواء في جوهر الفكرة المعروضة أو في مجرد طريقة العرض أو التعبير أو الترتيب أو التبويب أو الأسلوب"</em>.</p>
                    <p>والابتكار إما أن يكون مطلقاً وإما أن يكون نسبياً: فيكون مطلقاً إذا لم يكن المصنف يستند إلى إنتاج سابق. ويكون نسبياً إذا ما كان المصنف يقتبس عناصر شكلية لإنتاج سابق. ولكن في كلتا الحالتين لابد من خلق ذهني جديد في جملته لكي يكون شرط الابتكار متوافراً، ليتقرر حق المؤلف على مصنفه أو ليتمتع بالحماية أو ليستحق صاحبه الاعتراف بملكيته الفكرية وما يترتب عليها من حقوق. ويكفي أن يضيف المؤلف إلى فكرة سابقة ما يجعل للفكرة طابعاً جديداً تختلف به عما كانت عليه من قبل فإذا ما اتضح أن ما تحققه الفكرة لا يعدو أن يكون تطوراً عادياً وطبيعياً للقدر القائم أو مألوفاً لأهل الاختصاص فإنه عندئذ يتخلف عنصر الابتكار. ولمحكمة الموضوع سلطة استخلاص عناصر الابتكار في المصنف حتى يتمتع مؤلفه بالحماية القانونية إلا أنه يتعين عليها أن تفصح عن مصادر الأدلة التي كونت منها عقيدتها وفحواها وأن يكون لها مأخذها الصحيح من الأوراق مؤدية إلى النتيجة التي انتهت إليها متى يتأتى لمحكمة النقض أن تعمل رقابتها على سداد الحكم، وأن أخذها بتقرير الخبير مشروط بأن تبين المحكمة كيف أفاد التقرير معنى ما استخلصته منه. وكان ندب خبير في الدعوى هو مجرد وسيلة إثبات يقصد بها التحقق من واقع معين يحتاج الكشف عنه إلى معلومات فنية خاصة ولا شأن له بالفصل في نزاع قانوني فهذا من صميم واجب القاضي لا يجوز له التخلي عنه لغيره. كما قضت محكمة النقض بأنه <em>"متى انطوت طريقة أداء تلاوة القرآن الكريم على شيء من الابتكار بحيث يستبين أن مبتكرها خلع عليها من شخصيته ومن ملكاته وحواسه وقدراته ما يميزها عن غيرها فإنها تكون مصنفاً مما عنته المادة الثانية من القانون رقم 354 لسنة 1954 بشأن قانون حماية حق المؤلف مما يترتب عليها تمتع صاحبها بإعفاء 25% من الأرباح الصافية الناتجة عن الاشتغال به عند ربط أرباح المهن غير التجارية عليه"</em>. فإن الابتكار في المصنف يتجسد في الطابع الشخصي الذي يعطيه المؤلف لمصنفه، ويسمح الطابع الشخصي بتمييز المصنف عن غيره من المصنفات التي تنتمي إلى نفس نوعه، ويخضع تقدير توافر الطابع الابتكاري من عدم توافره لسلطة القاضي.</p>

                    <h3>ثانياً: الركن الشكلي</h3>
                    <p>هو أن يكون المصنف ذا حقيقة ملموسة وليس مجرد فكرة. ويتمثل الركن الشكلي في ضرورة إفراغ المصنف في صورة مادية يظهر فيها للواقع ويكون معداً للنشر، وليس مجرد فكرة لا تزال في ذهن صاحبها ولم تخرج بعد للواقع المادي. وهو ما يعني أن يكون المصنف قد بلغ حداً من الاستقرار وتوافر بشأنه الأصول المطلوبة للخروج للنور. ويستوي بعد ذلك نوع المصنف وطريقة التعبير عنه سواء ورد في شكل مصنفات مكتوبة أدبية أو علمية مثل الكتب والكتيبات والمقالات والنشرات وغيرها من المصنفات المكتوبة أو جاء المصنف في شكل سمعي (الصوت) مثل المصنفات الموسيقية والمحاضرات والخطب وأية مصنفات شفوية أخرى إذا كانت مسجلة. ويمكن أن يكون المصنف قد ظهر من خلال الرسم والنحت مثل اللوحات أو من خلال استخدام وسائل الحركة كالتمثيل والألعاب وكذلك المصنفات السمعية البصرية، وبرامج الحاسب الآلي. قضت محكمة النقض بأنه <em>"إذا انطوت فكرة الفوازير على شيء من الابتكار بحيث يستبين أن مبتكرها خلع عليها من شخصيته ومن ملكاته وحواسه وقدراته ما يميزها عن غيرها فإنها تكون مصنفاً فنياً"</em>.</p>

                    <h3>الابتكار المطلق والابتكار النسبي:</h3>
                    <p>أ) يكون الابتكار مطلقاً إذا لم يكن المصنف يستند إلى إنتاج سابق. ب) ويكون نسبياً: إذا ما كان المصنف يقتبس عناصر شكلية لإنتاج سابق. ولكن في كلتا الحالتين لابد من خلق ذهني جديد في جملته لكي يكون شرط الابتكار متوافراً، ليتقرر حق المؤلف على مصنفه أو ليتمتع بالحماية أو ليستحق صاحبه الاعتراف بملكيته الفكرية وما يترتب عليها من حقوق، ويكفي في ذلك أن يضيف المؤلف إلى فكرة سابقة ما يجعل للفكرة طابعاً جديداً تختلف به عما كانت عليه من قبل. فإذا ما اتضح أن ما تحققه الفكرة لا يعدو أن يكون تطوراً عادياً وطبيعياً للقدر القائم أو مألوفاً لأهل الاختصاص فإنه عندئذ يتخلف عنصر الابتكار. ويخضع استخلاص عناصر الابتكار في المصنف لسلطة قاضي الموضوع حتى يتمتع مؤلفه بالحماية القانونية إلا أنه يتعين عليها أن تفصح عن مصادر الأدلة التي كونت منها عقيدتها وفحواها. وأن يكون لها مأخذها الصحيح من الأوراق مؤدية إلى النتيجة التي انتهت إليها حتى يتسنى لمحكمة النقض أن تعمل رقابتها على سداد الحكم. استقر قضاء محكمة النقض على أنه: <em>"إذا كان الحكم إذ قضى بخلو العمل الذي قام به مورث الطاعنين اقتباساً عن الرواية الأصلية من الابتكار الذي يستأهل حماية القانون وبعدم وجود التماثل بين ذلك العمل وبين اقتباس المطعون عليهم. قد أقام قضاءه بذلك على أسباب سائغة وتؤدي إلى النتيجة التي انتهى إليها فإنه لا يكون على المحكمة بعد ذلك إذ هي لم تستجب إلى طلب الطاعنين بإجراء المقارنة بين العملين عن طريق ندب خبير أو عن طريق انتقال المحكمة لسماع الأداء العلني مادامت قد وجدت في أوراق الدعوى وعناصرها الأخرى ما يكفي لتكون رأيها فيها بنفسها"</em>.</p>

                    <h2>الحماية القانونية لعنوان المصنف</h2>
                    <p>بينت المادة 140 من قانون حماية حقوق الملكية الفكرية المصنفات الخاضعة لحماية هذا القانون، ثم ذكر المشرع في نهاية هذه المادة اشتمال الحماية القانونية لعنوان المصنف بشرط أن يكون عنواناً مبتكراً. حرص المشرع على حماية العنوان المبتكر للمصنف حتى لا يستفيد مصنف آخر من ثمرة المصنف صاحب العنوان المبتكر، وحتى لا يقع الجمهور في لبس وخلط بين المصنفين. واشترط المشرع لتقرير الحماية القانونية لعنوان المصنف أن يكون مبتكراً، وألا يكون هذا العنوان مجرد لفظ يوضح موضوع المصنف.</p>
                    <p>ومن أمثلة العناوين المبتكرة وحازت الانتشار الواسع في مجال مصنفات الموسيقى الغنائية أغنية "الأطلال"، "النهر الخالد"، وجريدة "الأهرام". قضت محكمة النقض بأنه: <em>"أن المشرع شمل بالحماية مؤلفي المصنفات المبتكرة ومن بينها المصنفات السمعية التي تذاع بواسطة الإذاعة اللاسلكية ويكون التعبير عنها بالصوت، كما أسبغ هذه الحماية على عنوان المصنف"</em>. واستلزم لذلك توافر شرطين متلازمين: أولهما أن يكون هذا العنوان متميزاً بطابع ابتكار والثاني ألا يكون العنوان لفظاً جارياً للدلالة على موضوع المصنف. ومن ثم لا تنسحب هذه الحماية على العنوان المكون من كلمة واحدة لها مدلول ثابت ومعروف لدى الكافة في الدلالة على شيء معين، إلا إذا استعملت في غرض غير المحدد لها أو أضيف إليها لفظ آخر يؤدي جماعهما معاً إلى دلالة غير معتادة على المسامع. كلمة "مانشيت" من الألفاظ الدارجة التي تنطبع في الذهن بمعنى الخبر والتي جرى الناس على استعمالها بهذا القصد، فإنه ينتفي عنها وصف الابتكار إذا استعملت كعنوان للمصنف.</p>
                    `
            },
            {
                id: 6,
                title: "المصنف الجماعي",
                content: `
                    <h2>المصنف الجماعي</h2>
                    <p>هو الذي يقوم بوضعه أكثر من مؤلف تحت إشراف وتوجيه شخص طبيعي أو اعتباري يقوم بنشره باسمه وتحت إدارته، ويندمج عمل المؤلفين فيه في الهدف العام الذي قصد إليه هذا الشخص بحيث يستحيل فصل عمل كل مؤلف وتمييزه على حدة. ويعد صاحب حق المؤلف في حالة المصنفات الجماعية هو الشخص الطبيعي أو الاعتباري الذي وجه ونظم ابتكار المصنف، فله وحده الحق في مباشرة حقوق المؤلف.</p>
                    <p>ومن أمثلة المصنفات الجماعية المعاجم فهي أعمال واسعة النطاق تتطلب تضافر جهود العديد من الأشخاص، بحيث لا يقوم بها عادة شخص واحد، وتتضافر جهود كل المؤلفين بشأنها تحت إدارة وتوجيه شخص واحد يضع خطة العمل ويشرف على تنفيذها، ولا يشترط أن يساهم في التأليف، فقد يقتصر دوره على الإشراف والتوجيه، وفي جميع الأحوال يعد هو مؤلف المصنف الجماعي، ويستوي أن يكون شخصاً طبيعياً أو اعتبارياً. اعترف المشرع المصري للشخص المعنوي بصفة المؤلف عليه، فلا خلاف في ظل القانون رقم 82 لسنة 2002 على إمكانية اعتبار الشخص المعنوي مؤلفاً وبصفة خاصة في المصنف الجماعي.</p>
                    <p>وقد عرض المشرع لحالة المصنف الجماعي الذي يندمج فيه عمل جميع المشتركين في التأليف بحيث لا يمكن فصل عمل كل منهم وتمييزه على حدة، حيث قرر في هذه الحالة أن الشخص الذي وجه العمل وكان تحت إدارته وإشرافه يكون هو المؤلف له، وله وحده الحق في مباشرة حقوق المؤلف المالية والأدبية، ويستوي أن يكون هذا الشخص طبيعياً (الإنسان) أو اعتبارياً مثل الجمعيات والشركات. ويشير البعض أن هناك حالة للمصنف الجماعي وتتمثل في كون عمل كل من المشتركين متميزاً عن عمل الآخر ويمكن فصله على حدة، هنا يظل الشخص الذي تم العمل تحت توجيهه وإدارته سواء شخص طبيعي أو اعتباري هو المؤلف لهذا المصنف في مجموعه ومع ذلك يثبت لكل مشترك في العمل مادام عمله متميزاً حق المؤلف على عمله فيثبت له الحق في مباشرة الحقوق المالية والأدبية على الجزء المتعلق به بشرط ألا ينافس المصنف الجماعي.</p>
                    <h3>مدة الحماية:</h3>
                    <p>ومن الجدير بالذكر أن المشرع قد قرر حماية الحقوق المالية لمؤلفي المصنفات الجماعية مدة خمسين سنة تبدأ من تاريخ نشرها أو إتاحتها للجمهور لأول مرة أيهما أبعد وذلك في حالة كون مالك حقوق المؤلف شخصاً اعتبارياً. أما إذا كان مالك هذه الحقوق شخصاً طبيعياً فتكون مدة الحماية القانونية للحقوق المالية مستمرة طيلة حياة المؤلف وكذلك تستمر لمدة خمسين سنة تبدأ من تاريخ وفاة المؤلف.</p>
                    `
            },
            {
                id: 7,
                title: "المصنف المشترك",
                content: `
                    <h2>المصنف المشترك</h2>
                    <p>هو المصنف الذي لا يندرج ضمن المصنفات الجماعية ويشترك في وضعه أكثر من شخص سواء أمكن فصل نصيب كل منهم فيه أم لم يمكن. ويستفاد من ذلك أن المصنفات المشتركة هي التي يشترك في تأليفها عدة أشخاص، دون أن يتوافر بشأنها ما يتطلب في المصنفات الجماعية من ضرورة التأليف تحت إشراف وتوجيه شخص معين. وتقسم المصنفات المشتركة لنوعين هما:</p>
                    <ul>
                        <li><strong>النوع الأول: مصنفات يتعذر معها فصل نصيب كل مؤلف:</strong> مثل اشتراك مجموعة مؤلفين في كتابة رواية واحدة أو رسم لوحة فنية، أو تأليف مسرحية، أو لحن موسيقى. وفي هذه الحالة يعتبر جميع المؤلفين أصحاب حق المؤلف بالتساوي بينهم، ما لم يتفق بينهم على غير ذلك، وبشرط أن يتم هذا الاتفاق كتابة، فقد يقدر المؤلفين بحكم علمهم بما بذله كل منهم من جهد في التأليف على تحديد نصيب كل منهم بصورة غير متساوية، ولكن إذا لم يوجد مثل هذا الاتفاق فتحسب حصة كل منهم بالتساوي. ويترتب على ذلك أنه لا يجوز مباشرة الحقوق المترتبة على حق المؤلف إلا باتفاقهم جميعاً، سواء الحقوق المالية والأدبية، فيجب اتفاقهم جميعاً على تحديد وقت نشر المصنف، ونسبته إليهم، وكذلك الاتفاق على سحب المصنف أو تعديله إذا لزم الأمر. ولا يجوز انفراد أحدهم بمباشرة حقوق المؤلف إلا باتفاق مكتوب بين جميع المؤلفين، فإذا وقع خلاف أو نزاع بينهم في هذا الشأن يتم الرجوع للمحكمة المختصة للفصل فيه.</li>
                        <li><strong>النوع الثاني: مصنفات يمكن فصل نصيب كل مؤلف:</strong> مثل قيام شخصان بالاشتراك في عمل أغنية أحدهما قام بتأليف كلماتها والآخر قام بتلحينها. ويعد الشركاء في المصنف المشترك هم أصحاب حق المؤلف، ويكون لكل منهم حصته في المصنف بحسب الاتفاق أو بالتساوي إذا لم يوجد اتفاق بينهم. ويتميز هذا النوع من المصنفات المشتركة بإمكانية فصل عمل كل مؤلف على حدة وتمييزه عن عمل الباقين. ويجوز لكل منهم على سبيل الانفراد حق استغلال نصيبه بشرط ألا يضر في ذلك باستغلال المصنف المشترك، وذلك كله ما لم يتفق جميع المؤلفين على حرمان كل طرف من هذا الحق، وبشرط أن يكون هذا الاتفاق قد تم كتابة.</li>
                    </ul>
                    `
            },
            {
                id: 8,
                title: "الأمور التي لا تشملها الحماية القانونية لحقوق المؤلف",
                content: `
                    <h2>الأمور التي لا تشملها الحماية القانونية لحقوق المؤلف</h2>
                    <p>تنص المادة 141 على أن الحماية لا تشمل <strong>مجرد الأفكار والإجراءات وأساليب العمل وطرق التشغيل والمفاهيم والمبادئ والاكتشافات والبيانات</strong>، ولو كان معبراً عنها أو موصوفة أو موضحة أو مدرجة في مصنف.</p>
                    <h3>كذلك لا تشمل الحماية:</h3>
                    <ul>
                        <li><strong>أولاً: الوثائق الرسمية</strong> أياً كانت لغتها الأصلية أو المنقولة إليها، كنصوص القوانين واللوائح والقرارات والاتفاقيات الدولية والأحكام القضائية وأحكام المحكمين وقرارات اللجان الإدارية ذات الاختصاص القضائي. والسبب أن الاطلاع عليها حق مكفول للجميع، بل واجب قانوني أحياناً. غير أنه إذا قام ناشرها بتجميعها وتبويبها وترتيبها بشكل يظهر شخصيته الابتكارية، فتكون محلاً للحماية.</li>
                        <li><strong>ثانياً: أخبار الحوادث والوقائع الجارية</strong> التي تكون مجرد أخبار صحفية، لخلوها من الابتكار. وتخضع للحماية إذا جُمعت ورُتبت وعُرضت بطابع ابتكاري يظهر شخصية المؤلف.</li>
                    </ul>
                    <h3>شروط المصنف للتمتع بالحماية:</h3>
                    <p>يجب توافر ركنين:</p>
                    <ul>
                        <li><strong>الركن الشكلي:</strong> إفراغ المصنف في صورة مادية، لا مجرد فكرة في الذهن.</li>
                        <li><strong>الركن الموضوعي:</strong> الابتكار، وهو الطابع الشخصي الذي يضفيه المؤلف على مصنفه، ويكفي أن يضفي على فكرة قديمة شخصيته فيمنحها أصالة تميزها.</li>
                    </ul>`
            },
            {
                id: 9,
                title: "التكييف القانوني لحقوق المؤلف",
                content: `
                    <h2>التكييف القانوني لحقوق المؤلف</h2>
                    <ul>
                        <li><strong>الاتجاه الأول: حقوق شخصية</strong><br>يرى أنها حقوق لصيقة بشخصية المؤلف لا تنفصل عنه، وتتمتع بذات الحماية المقررة للشخص. <em>نُقد</em> لأن اعتبارها جزءاً من الشخصية يعني عدم قبولها للحوالة أو الحجز، وهذا يتعارض مع وجودها المالي.</li>
                        <li><strong>الاتجاه الثاني: حق ملكية</strong><br>يرى أنها حق ملكية يتسم بسلطات الاستعمال والاستغلال والتصرف، لكنه يرد على أشياء غير مادية، فهو حق ملكية من نوع خاص. <em>نُقد</em> لتجاهله الحق الأدبي الذي لا يمكن إخضاعه لأحكام حق الملكية، وقضت محكمة النقض بأن الملكية الفكرية تؤتي ثمارها بالانتشار لا بالاستئثار، خلافاً للملكية العادية. كما قضت بأنه "ليس حق ملكية، بل هو حق عيني أصلي يقع على شيء غير مادي، فهو حق عيني أصلي منقول".</li>
                        <li><strong>الاتجاه الثالث: حق فكري وإبداعي</strong><br>يرى أنه لا حق شخصي ولا حق ملكية، بل ينتمي لطائفة الحقوق الذهنية أو الفكرية التي محلها الفكر والإبداع.</li>
                        <li><strong>الاتجاه الرابع: الحق المزدوج — الراجح فقهاً وقضاءً</strong><br>يتكون من حقين أساسيين:<br>
                            - <strong>الحق المالي:</strong> موقوت ومحدد بأجل تسقط الحماية بانقضائه، ينظم القانون التعامل فيه، ولا يتعلق بالنظام العام.<br>
                            - <strong>الحق الأدبي:</strong> دائم غير قابل للتقادم، يخول المؤلف حق نشر مصنفه ونسبته لنفسه وسحبه من التداول ومنع أي تعديل عليه، ولا يسقط بالنزول عنه أو عدم استعماله، وكل تصرف فيه باطل بطلاناً مطلقاً متعلقاً بالنظام العام. وقد أكدت محكمة النقض المصرية هذا التوجه بقولها إن المشرع "أفصح بجلاء عن الطبيعة المزدوجة لحقوق المؤلف وفرق بين الحقوق المالية والحقوق الأدبية وأورد لكل منها أحكاماً تتفق وطبيعة الحق".

                    </ul>`

                title: "تعريف براءة الاختراع وشروط منحها",
                content: `
                    <h2>تعريف براءة الاختراع وشروط منحها</h2>
                    <p><strong>التعريف:</strong> قرار إداري يصدر من الجهة المختصة يخول صاحبه حقَّي استغلال براءة الاختراع والتصرف فيها بصفة مؤقتة، مع جواز الحجز عليها باعتبارها مالاً منقولاً معنوياً.</p>
                    <p>تُمنح البراءة وفق المادة الأولى من القانون 82/2002 عن كل اختراع <strong>قابل للتطبيق الصناعي، جديد، ويمثل خطوة إبداعية</strong>، سواء تعلق بمنتجات صناعية جديدة أو طرق صناعية مستحدثة أو تطبيق جديد لطرق معروفة. وتُمنح البراءة أيضاً عن كل تعديل أو تحسين أو إضافة على اختراع سابق إذا توافرت فيه ذات الشروط.</p>
                    <h3>شروط منح براءة الاختراع:</h3>
                    <ul>
                        <li><strong>أ) الابتكار:</strong> لا يشترط درجة معينة من الابتكار، يكفي أي قدر منه ما دام لم يوجد من قبل وتم التوصل إليه بالفكر الإنساني.</li>
                        <li><strong>ب) الجدة المطلقة:</strong> أن يكون الاختراع لم يُعرف ولم يُنشر عنه في أي بلد، وألا يكون قد سُبق بطلب براءة أو منح براءة عنه في مصر أو الخارج. وحدد المشرع حالتين يُعد الاختراع فيهما غير جديد:<br>
                        - إذا سبق تقديم طلب براءة أو صدور براءة عنه أو عن جزء منه في مصر أو الخارج قبل تاريخ الطلب.<br>
                        - إذا سبق استعماله أو استغلاله علنياً أو أُفصح عن وصفه بما يمكّن ذوي الخبرة من استغلاله قبل تقديم الطلب. <em>استثناء:</em> لا يُعد إفصاحاً الكشفُ عن الاختراع في المعارض الوطنية أو الدولية خلال الستة أشهر السابقة على تقديم الطلب.<br>
                        <br><em>ملاحظة:</em> شرط الجدة المطلقة خاص ببراءات الاختراع، أما حماية المصنفات الأدبية فيكفي فيها شرط الابتكار وحده.</li>
                        <li><strong>ج) القابلية للاستغلال الصناعي:</strong> يُقصد به استبعاد الأفكار المجردة والابتكارات النظرية البحتة، ويشمل كل استغلال اقتصادي سواء في الصناعة أو الزراعة أو التجارة أو الصناعات الاستخراجية، دون أن يشمل استنبات محاصيل أو بذور جديدة.</li>
                        <li><strong>د) ألا يمس الاختراع الأمن القومي أو النظام العام أو الآداب أو البيئة أو صحة الإنسان أو الحيوان أو النبات.</strong></li>
                    </ul>
                    <h3>إجراءات الحصول على البراءة:</h3>
                    <p>يُقدَّم الطلب من المخترع أو من آلت إليه حقوقه إلى مكتب براءات الاختراع، ولا يجوز أن يتضمن الطلب أكثر من اختراع واحد (ويُعدّ في حكم الواحد مجموعة الاختراعات التي تشكل فكرة إبداعية متكاملة). يفحص المكتب الطلب ويُعلن عن قبوله، ويجوز لكل ذي شأن الاعتراض، ولا يتم الإعلان إلا بعد انقضاء سنة من تاريخ التقديم.</p>`
            },

                content: `
                    <h2>صاحب الحق في براءة الاختراع</h2>
                    <p>تنص المادة السادسة على أن الحق في البراءة يثبت للمخترع أو لمن آلت إليه حقوقه، وحدد المشرع ثلاث حالات:</p>

                        <li><strong>ج) توصل عدة أشخاص للاختراع ذاته بشكل مستقل:</strong> يثبت الحق للأسبق في تقديم طلب البراءة.</li>

            {
                id: 12,
                title: "صاحب الحق في براءة اختراع العامل",
                content: `
                    <h2>صاحب الحق في براءة اختراع العامل</h2>
                    <p>تنص المادة السابعة على ثلاث حالات:</p>

            const vert  = Math.max(spaceBottom, spaceTop);

            if (horiz >= vert && horiz > 120) {
                // Horizontal: fill the larger side, vertically center on orb
                const side = spaceRight >= spaceLeft ? 'right' : 'left';
                const available = side === 'right' ? spaceRight : spaceLeft;
                const panelW = Math.min(available, 300);
                const panelH = H - 2 * EDGE;

                let topOff = (btn.height / 2) - panelH / 2;
                const absTop = btn.top + topOff;
                if (absTop < EDGE) topOff += EDGE - absTop;
                if (absTop + panelH > H - EDGE) topOff -= (absTop + panelH) - (H - EDGE);

                menuDropdown.style.top = topOff + 'px';
                menuDropdown.style.width = panelW + 'px';
                menuDropdown.style.maxHeight = panelH + 'px';
                if (side === 'right') menuDropdown.style.left = (ORB + EDGE) + 'px';
                else menuDropdown.style.right = (ORB + EDGE) + 'px';
            } else {
                // Vertical: fill the larger side, center horizontally on orb
                const side = spaceBottom >= spaceTop ? 'bottom' : 'top';
                const available = side === 'bottom' ? spaceBottom : spaceTop;
                const panelH = Math.min(available, H * 0.82);
                const panelW = Math.min(W - 2 * EDGE, 300);

                let leftOff = (ORB / 2) - panelW / 2;
                const absLeft = btn.left + leftOff;
                if (absLeft < EDGE) leftOff += EDGE - absLeft;
                if (absLeft + panelW > W - EDGE) leftOff -= (absLeft + panelW) - (W - EDGE);

                menuDropdown.style.left = leftOff + 'px';
                menuDropdown.style.width = panelW + 'px';
                menuDropdown.style.maxHeight = panelH + 'px';
                if (side === 'bottom') menuDropdown.style.top = (ORB + EDGE) + 'px';
                else menuDropdown.style.bottom = (ORB + EDGE) + 'px';
            }
        }

        function toggleMenu(forceState) {
            isMenuOpen = forceState !== undefined ? forceState : !isMenuOpen;
            if (isMenuOpen) {
                positionDropdown();
                menuDropdown.style.opacity = '1';
                menuDropdown.style.transform = 'scale(1)';
                menuDropdown.style.pointerEvents = 'auto';
                menuIcon.classList.add('hidden'); menuIcon.classList.remove('block');
                closeIcon.classList.remove('hidden'); closeIcon.classList.add('block');
                menuToggle.classList.add('open');
                setTimeout(() => {
                    const active = menuList.querySelector('.active');
                    if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }, 80);
            } else {
                menuDropdown.style.opacity = '0';
                menuDropdown.style.transform = 'scale(0.85)';
                menuDropdown.style.pointerEvents = 'none';
                menuIcon.classList.remove('hidden'); menuIcon.classList.add('block');
                closeIcon.classList.add('hidden'); closeIcon.classList.remove('block');
                menuToggle.classList.remove('open');
            }
        }

        const floatingMenuContainer = document.getElementById('floatingMenuContainer');
        const menuWrapper = document.getElementById('menuWrapper');

        let isDragging = false;
        let startX, startY, initialX, initialY;
        let dragged = false;

        function setDragTransition(on) {
            floatingMenuContainer.style.transition = on
                ? 'top 0.38s cubic-bezier(0.34,1.56,0.64,1), left 0.38s cubic-bezier(0.34,1.56,0.64,1)'
                : 'none';
        }

        menuToggle.addEventListener('pointerdown', (e) => {
            if (e.button !== 0 && e.type !== 'touchstart') return;
            isDragging = true;
            dragged = false;
            startX = e.clientX;
            startY = e.clientY;
            const rect = floatingMenuContainer.getBoundingClientRect();
            initialX = rect.left;
            initialY = rect.top;
            setDragTransition(false);
            floatingMenuContainer.style.bottom = 'auto';
            floatingMenuContainer.style.right = 'auto';
            floatingMenuContainer.style.left = initialX + 'px';
            floatingMenuContainer.style.top = initialY + 'px';
            menuToggle.style.cursor = 'grabbing';
            menuToggle.setPointerCapture(e.pointerId);
        });

        menuToggle.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
                dragged = true;
                if (isMenuOpen) toggleMenu(false);
            }
            const bW = menuToggle.offsetWidth;
            const bH = menuToggle.offsetHeight;
            floatingMenuContainer.style.left = Math.max(8, Math.min(initialX + dx, window.innerWidth - bW - 8)) + 'px';
            floatingMenuContainer.style.top = Math.max(8, Math.min(initialY + dy, window.innerHeight - bH - 8)) + 'px';
        });

        menuToggle.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            menuToggle.style.cursor = 'grab';
            menuToggle.releasePointerCapture(e.pointerId);
            if (!dragged) { toggleMenu(); return; }

            // Snap to nearest horizontal edge
            const bW = menuToggle.offsetWidth;
            const bH = menuToggle.offsetHeight;
            const curX = parseFloat(floatingMenuContainer.style.left);
            const curY = parseFloat(floatingMenuContainer.style.top);
            const snappedX = curX < (window.innerWidth - bW) / 2 ? 16 : window.innerWidth - bW - 16;
            const snappedY = Math.max(16, Math.min(curY, window.innerHeight - bH - 16));
            setDragTransition(true);
            floatingMenuContainer.style.left = snappedX + 'px';
            floatingMenuContainer.style.top = snappedY + 'px';
        });

        // Hide header on scroll down, show on scroll up
        const siteHeader = document.getElementById('siteHeader');
        let lastScrollY = window.scrollY;
        let headerHidden = false;
        window.addEventListener('scroll', () => {
            const currentY = window.scrollY;
            const delta = currentY - lastScrollY;
            if (delta > 6 && currentY > 80 && !headerHidden) {
                siteHeader.style.transform = 'translateY(-100%)';
                siteHeader.style.opacity = '0';
                headerHidden = true;
            } else if (delta < -4 && headerHidden) {
                siteHeader.style.transform = 'translateY(0)';
                siteHeader.style.opacity = '1';
                headerHidden = false;
            }
            lastScrollY = currentY;
        }, { passive: true });

        themeToggle.addEventListener('click', toggleTheme);

        document.addEventListener('click', (e) => {
            if (isMenuOpen && !menuDropdown.contains(e.target) && !menuToggle.contains(e.target)) {
                toggleMenu(false);
            }
        });

        renderArticle();
    </script>
</body>
</html>
